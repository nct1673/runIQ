services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: runiq
      POSTGRES_PASSWORD: runiq
      POSTGRES_DB: runiq
    ports:
      - "5432:5432"
      # Optional marketing page: `docker compose --profile landing up -d landing`,
  # then open http://localhost:3030. Static files only; independent of the app.
  landing:
    build: ./landing
    pull_policy: build
    profiles: ["landing"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_PORT:-3030}:80"

volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://runiq:runiq@postgres:5432/runiq
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
